name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préfixer les chemins (uniquement sans domaine personnalisé)
        run: |
          if [ -f site/CNAME ]; then
            echo "Domaine personnalisé détecté ($(cat site/CNAME)) : site servi à la racine, pas de préfixe."
          else
            python3 prefixe_chemins.py site "${GITHUB_REPOSITORY#*/}"
          fi

      - name: Désactiver Jekyll
        run: touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
